version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - API_BASE_URL=http://localhost:8000/api
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    volumes:
      - ./data:/app/data
      - ./src/models/saved_models:/app/src/models/saved_models
