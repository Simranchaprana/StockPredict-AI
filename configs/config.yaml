project_name: StockPredict-AI
version: 2.0

tickers:
  - "RELIANCE.NS"
  - "TCS.NS"
  - "AAPL"

market_context:
  AAPL:
    broad_index: "^GSPC"     # S&P 500
    sector_index: "XLK"      # Technology Select Sector SPDR Fund
    vix: "^VIX"              # CBOE Volatility Index
    fx: "DX-Y.NYB"           # US Dollar Index
  RELIANCE.NS:
    broad_index: "^NSEI"     # NIFTY 50
    sector_index: "^CNXENERGY" # NIFTY Energy
    vix: "^INDIAVIX"         # India VIX
    fx: "INR=X"              # USD/INR
  TCS.NS:
    broad_index: "^NSEI"     # NIFTY 50
    sector_index: "^CNXIT"   # NIFTY IT
    vix: "^INDIAVIX"         # India VIX
    fx: "INR=X"              # USD/INR

model_params:
  rf_classifier:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 10
    min_samples_leaf: 5
    random_state: 42
  rf_regressor:
    n_estimators: 100
    max_depth: 10
    random_state: 42
  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"

validation:
  n_splits: 5
  method: "time_series_split"

backtest:
  initial_capital: 100000
